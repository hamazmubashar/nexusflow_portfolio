# NexusFlow Autopilot — local infrastructure (Stage 1)
# Usage:  cp .env.example .env  &&  docker compose up -d
# Services bind to 127.0.0.1 only; nothing is exposed beyond this machine.

name: nexusflow

services:
  postgres:
    # Official pgvector build on PostgreSQL 16 (multi-arch, native on Apple Silicon)
    image: pgvector/pgvector:pg16
    container_name: nexusflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-nexusflow}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs once on first boot: enables pgvector and creates the n8n database
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    networks: [backend]

  n8n:
    image: n8nio/n8n:2.45.5
    container_name: nexusflow-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # n8n stores its own state in a separate database on the same server
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nexusflow}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env (see .env.example)}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_HOST_PORT:-5678}
      WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"          # plain http on localhost
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      # --- NexusFlow Autopilot integration (Stage 3) ---
      # Code nodes sign/verify payloads with HMAC-SHA256 and read these two vars via $env
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NEXUSFLOW_WEBHOOK_SECRET: ${WEBHOOK_SIGNING_SECRET:?Set WEBHOOK_SIGNING_SECRET in .env (see .env.example)}
      # FastAPI backend on the host (8010: FlowPilot's gateway already proxies host port 8000)
      NEXUSFLOW_API_BASE_URL: ${NEXUSFLOW_API_BASE_URL:-http://host.docker.internal:8010}
      # Optional Slack (or Discord, with NEXUSFLOW_ALERT_FORMAT=discord) incoming-webhook URL for P1 alerts
      NEXUSFLOW_ALERT_WEBHOOK_URL: ${NEXUSFLOW_ALERT_WEBHOOK_URL:-}
      NEXUSFLOW_ALERT_FORMAT: ${NEXUSFLOW_ALERT_FORMAT:-slack}
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Version-controlled workflow exports, importable via `n8n import:workflow`
      - ./n8n_workflows:/workflows
    extra_hosts:
      # lets n8n call the FastAPI backend running on the host
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    networks: [backend]

volumes:
  pg_data:
    name: nexusflow_pg_data
  n8n_data:
    name: nexusflow_n8n_data

networks:
  backend:
    name: nexusflow_backend
