[server]
port = 8502
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#6C63FF"
backgroundColor = "#F3F5F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E1A2B"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "type"   # never show end users a traceback with file paths
showSidebarNavigation = false
