# No port or address here: hosting health checks expect Streamlit's default. run.sh sets both for local use.
[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#6C63FF"
backgroundColor = "#F3F5F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E1A2B"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "type"   # never show end users a traceback with file paths
showSidebarNavigation = false
