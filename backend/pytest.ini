[pytest]
testpaths = tests
pythonpath = .
markers =
    integration: requires a running PostgreSQL (docker compose up -d postgres)
    live: calls the Gemini API (needs GEMINI_API_KEY); deselect with -m "not live"
    e2e: real FastAPI <-> n8n round trips (docker compose up -d, workflows published, uvicorn on :8010)
filterwarnings =
    ignore::DeprecationWarning:google.genai.*
    ignore::DeprecationWarning:langsmith.*
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
